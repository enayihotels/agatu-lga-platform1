# Render Blueprint for AgatuConnect.
#
# This file lets Render create every service in one pass via
# "New > Blueprint" in the dashboard, pointed at this GitHub repo.
#
# HONEST NOTE: Render's exact Blueprint schema can change over time.
# This is a carefully-reasoned best effort, not a guarantee -- the
# first deploy attempt may surface a schema validation error that
# needs a small fix based on Render's actual error message, the same
# way we debugged everything else in this project.

databases:
  - name: agatu-postgres
    plan: free
    databaseName: agatu
    user: agatu

services:
  # --- Backend (Django API) ---
  - type: web
    name: agatu-backend
    runtime: python
    plan: starter
    buildCommand: "cd backend && pip install -r requirements/production.txt && python manage.py collectstatic --noinput"
    startCommand: "cd backend && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    disk:
      name: agatu-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: agatu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agatu-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: agatu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: agatu-redis
          property: connectionString
      - key: MEDIA_ROOT_OVERRIDE
        value: /var/data/media
      - key: CORS_ALLOWED_ORIGINS
        value: https://agatu-frontend.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: OLLAMA_BASE_URL
        value: http://agatu-ollama:11434
      - key: OLLAMA_MODEL
        value: llama3.2:1b

  # --- Redis (Celery broker/backend) ---
  - type: redis
    name: agatu-redis
    plan: free
    ipAllowList: []

  # --- Frontend (static build) ---
  - type: web
    name: agatu-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agatu-backend.onrender.com/api
