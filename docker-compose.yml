services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agatu
      POSTGRES_USER: agatu
      POSTGRES_PASSWORD: agatu_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agatu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Added in later phases, listed here so docker-compose.yml only
  # needs small diffs as we go instead of a full rewrite each phase ---
  # celery_worker:
  # celery_beat:
  # ollama:
  # frontend:

volumes:
  pgdata:
